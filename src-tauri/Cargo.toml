[package]
name = "aqlicker"
version = "0.1.0"
description = "A local AQlicker desktop application"
authors = ["aatricks"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "aqlicker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
atomic-write-file = "0.3"
enigo = "0.6.1"
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"

[dev-dependencies]
tempfile = "3"
